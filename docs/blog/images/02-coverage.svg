<text x="40.0" y="540.0" font-size="14.5" fill="#52514e" font-weight="400" text-anchor="start" >Self-correction closes most of the gap but not all of it, and the ranges are about 15% wider.</text>
<text x="40.0" y="562.0" font-size="14.5" fill="#52514e" font-weight="400" text-anchor="start" >Only seven dates could be scored, so treat these as indicative until the first predictions mature (70 days).</text>
<text x="40" y="598" font-size="12.5" fill="#7a7975">Source: OSS Radar, 3,094 supervised rows, forward-chained over 7 later forecast dates (637 rows); the first row uses one calibration split.</text>
