<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" width="1100" height="620" role="img" aria-label="Two bar groups, 80 and 90 percent targets. Coverage improves from 58.5 to 75.8 percent at the 80 percent target and from 79.6 to 87.4 percent at the 90 percent target." font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Promised vs delivered: how often the real outcome fell inside the range</title>
<rect width="1100" height="620" fill="#fcfcfb" rx="14"/>
<rect x="0.5" y="0.5" width="1099" height="619" fill="none" stroke="#cfcec8" rx="14"/>
