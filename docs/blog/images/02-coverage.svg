<text x="40" y="82" font-size="15" fill="#52514e">Share of outcomes inside the forecast range. The dashed line is what the range promised</text>
<text x="330.0" y="202.0" font-size="14" fill="#52514e" font-weight="400" text-anchor="end" >Textbook method, one calibration split</text>
<text x="330.0" y="274.0" font-size="14" fill="#52514e" font-weight="400" text-anchor="end" >Textbook method, tested on later dates</text>
