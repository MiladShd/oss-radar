<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560" role="img" aria-label="Grouped bars for three training windows. Survival model predicts 6.6 to 7.3 percent; the classifier 17 to 29 percent; the actual rate was 7.7 to 8.2 percent." font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>A standard classifier over-forecast by 2 to 4 times; the survival model stayed close</title>
