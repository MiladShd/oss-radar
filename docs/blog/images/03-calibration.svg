<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" width="1100" height="640" role="img" aria-label="Three panels, one per training window, comparing five methods by forecast error. The survival model has the lowest error in each; the standard classifier and the whole-history baseline over-forecast by roughly two to three times." font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Anchoring to the recent event rate is what fixed the probabilities</title>
