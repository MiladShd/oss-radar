<text x="40" y="82" font-size="15" fill="#52514e">Average predicted chance of a new security advisory in 14 days, against what actually happened</text>
<line x1="90.0" y1="420.0" x2="1060.0" y2="420.0" stroke="#cfcec8" stroke-width="1"/>
<text x="78.0" y="425.0" font-size="13" fill="#7a7975" font-weight="400" text-anchor="end" >0%</text>
