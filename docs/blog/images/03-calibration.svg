<line x1="90.0" y1="265.7" x2="1060.0" y2="265.7" stroke="#ebeae5" stroke-width="1"/>
<text x="78.0" y="270.7" font-size="13" fill="#7a7975" font-weight="400" text-anchor="end" >20%</text>
<line x1="90.0" y1="188.6" x2="1060.0" y2="188.6" stroke="#ebeae5" stroke-width="1"/>
<text x="78.0" y="193.6" font-size="13" fill="#7a7975" font-weight="400" text-anchor="end" >30%</text>
<rect x="130.0" y="369.0" width="64.0" height="51.0" fill="#2a78d6" rx="4"/>
<text x="162.0" y="359.0" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="middle" >6.6%</text>
<rect x="216.0" y="193.7" width="64.0" height="226.3" fill="#eb6834" rx="4"/>
<text x="248.0" y="183.7" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="middle" >29.3%</text>
<rect x="302.0" y="356.4" width="64.0" height="63.6" fill="#3a3a38" rx="4"/>
<text x="334.0" y="346.4" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="middle" >8.2%</text>
<text x="248.0" y="450.0" font-size="14" fill="#52514e" font-weight="600" text-anchor="middle" >Trained on first 60 days</text>
<rect x="440.0" y="369.2" width="64.0" height="50.8" fill="#2a78d6" rx="4"/>
<text x="472.0" y="359.2" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="middle" >6.6%</text>
<rect x="526.0" y="247.5" width="64.0" height="172.5" fill="#eb6834" rx="4"/>
<text x="558.0" y="237.5" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="middle" >22.4%</text>
<rect x="612.0" y="356.4" width="64.0" height="63.6" fill="#3a3a38" rx="4"/>
<text x="644.0" y="346.4" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="middle" >8.2%</text>
<text x="558.0" y="450.0" font-size="14" fill="#52514e" font-weight="600" text-anchor="middle" >Trained on first 70 days</text>
<rect x="750.0" y="363.5" width="64.0" height="56.5" fill="#2a78d6" rx="4"/>
<text x="782.0" y="353.5" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="middle" >7.3%</text>
<rect x="836.0" y="286.1" width="64.0" height="133.9" fill="#eb6834" rx="4"/>
<text x="868.0" y="276.1" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="middle" >17.4%</text>
<rect x="922.0" y="360.7" width="64.0" height="59.3" fill="#3a3a38" rx="4"/>
<text x="954.0" y="350.7" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="middle" >7.7%</text>
<text x="868.0" y="450.0" font-size="14" fill="#52514e" font-weight="600" text-anchor="middle" >Trained on first 80 days</text>
<rect x="90.0" y="112.0" width="16.0" height="16.0" fill="#2a78d6" rx="3"/>
<text x="114.0" y="125.0" font-size="14" fill="#0b0b0b" font-weight="600" text-anchor="start" >Survival model (shipped)</text>
<rect x="349.2" y="112.0" width="16.0" height="16.0" fill="#eb6834" rx="3"/>
<text x="373.2" y="125.0" font-size="14" fill="#0b0b0b" font-weight="600" text-anchor="start" >Standard classifier</text>
<rect x="566.9" y="112.0" width="16.0" height="16.0" fill="#3a3a38" rx="3"/>
<text x="590.9" y="125.0" font-size="14" fill="#0b0b0b" font-weight="600" text-anchor="start" >What actually happened</text>
<text x="40.0" y="490.0" font-size="14.5" fill="#52514e" font-weight="400" text-anchor="start" >The classifier over-forecast by 2.3 to 3.6 times. A number you cannot set a threshold on is not a probability.</text>
<text x="40.0" y="513.0" font-size="14.5" fill="#52514e" font-weight="400" text-anchor="start" >Ranking skill (AUC) was similar for both, 0.79 to 0.84, so the difference is calibration, not ordering.</text>
<text x="40" y="538" font-size="12.5" fill="#7a7975">Source: OSS Radar, 91 packages, 167 events. Models trained on the first 60, 70 or 80 days, scored on later weekly forecasts.</text>
</svg>