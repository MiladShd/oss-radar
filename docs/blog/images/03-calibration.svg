<text x="884.3" y="415.0" font-size="11.5" fill="#7a7975" font-weight="400" text-anchor="start" >predicts 17%</text>
<rect x="816.0" y="437.0" width="58.9" height="26.0" fill="#b9b8b2" rx="4"/>
<text x="882.9" y="455.0" font-size="14" fill="#0b0b0b" font-weight="600" text-anchor="start" >0.073</text>
<text x="882.9" y="473.0" font-size="11.5" fill="#7a7975" font-weight="400" text-anchor="start" >predicts 19%</text>
<text x="40.0" y="540.0" font-size="14.5" fill="#52514e" font-weight="400" text-anchor="start" >The standard classifier and the whole-history survival baseline both forecast 17 to 29% for something that happened 8% of the time.</text>
<text x="40.0" y="562.0" font-size="14.5" fill="#52514e" font-weight="400" text-anchor="start" >Anchoring either model to the recent rate fixes most of that. The survival model still had the lowest error in every window and ranked best (AUC 0.82 to 0.84).</text>
<text x="40.0" y="584.0" font-size="14.5" fill="#52514e" font-weight="400" text-anchor="start" >Brier score is squared error of the probability: it rewards both ranking and calibration, so read it together with the predicted-versus-actual rate.</text>
<text x="40" y="618" font-size="12.5" fill="#7a7975">Source: OSS Radar, 91 packages, 168 events, evaluated on weekly forecasts after each training window. Small samples: 21 to 45 events per window.</text>
</svg>