<text x="40" y="82" font-size="15" fill="#52514e">A scheduled data and ML pipeline, a read-only dashboard, and a release path that is checked before it ships</text>
<rect x="40" y="125" width="180" height="132" rx="10" fill="#f3f2ee" stroke="#cfcec8" stroke-width="1.5"/>
