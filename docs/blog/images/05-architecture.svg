<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 570" width="1100" height="570" role="img" aria-label="Flow diagram from public data sources to a daily Cloud Run job, BigQuery, models, dashboard and custom domain, with a CI and deploy path beneath." font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>How OSS Radar fits together</title>
