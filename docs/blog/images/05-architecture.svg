<rect x="840" y="330" width="220" height="84" rx="10" fill="#fdf0ea" stroke="#eb6834" stroke-width="1.5"/>
<text x="950.0" y="360.0" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="middle" >radar.miladblog.com</text>
<text x="950.0" y="384.0" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="middle" >Cloudflare edge cache</text>
<text x="950.0" y="403.0" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="middle" >Worker proxy</text>
<line x1="989.0" y1="257.0" x2="989.0" y2="328.0" stroke="#52514e" stroke-width="2"/>
<line x1="989.0" y1="328.0" x2="984.7" y2="319.0" stroke="#52514e" stroke-width="2"/>
<line x1="989.0" y1="328.0" x2="993.3" y2="319.0" stroke="#52514e" stroke-width="2"/>
<rect x="40" y="330" width="760" height="84" rx="10" fill="#f3f2ee" stroke="#cfcec8" stroke-width="1.5"/>
<text x="420.0" y="360.0" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="middle" >Release path</text>
<text x="420.0" y="384.0" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="middle" >pull request → lint + 219 tests (23 browser) + security scan → exact-commit image build → Cloud Run deploy</text>
<text x="420.0" y="403.0" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="middle" >infrastructure defined in Terraform</text>
<text x="40.0" y="462.0" font-size="14.5" fill="#52514e" font-weight="400" text-anchor="start" >Only the daily job writes to the warehouse and the dashboard reads it. A failure while fitting the survival model is caught,</text>
<text x="40.0" y="485.0" font-size="14.5" fill="#52514e" font-weight="400" text-anchor="start" >so the run continues without advisory probabilities. A retrained growth model must pass the validation gate and beat the champion before it serves.</text>
<text x="40" y="548" font-size="12.5" fill="#7a7975">Source: OSS Radar repository (infra/terraform, .github/workflows, pipeline/, dashboard/).</text>
</svg>