<text x="791.0" y="217.0" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="middle" >Cox survival</text>
<text x="791.0" y="236.0" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="middle" >risk composite</text>
<rect x="918" y="125" width="142" height="132" rx="10" fill="#f3f2ee" stroke="#cfcec8" stroke-width="1.5"/>
