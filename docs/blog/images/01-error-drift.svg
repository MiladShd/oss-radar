<text x="40.0" y="478.0" font-size="14.5" fill="#52514e" font-weight="400" text-anchor="start" >On 29 July the model over-shot by 0.191 on average against a typical miss of 0.221, so nearly all of its error pointed the same way.</text>
<text x="40" y="498" font-size="12.5" fill="#7a7975">Source: OSS Radar growth model, 91 packages, forecast dates 2026-07-02 to 2026-07-29, data through 2026-10-08.</text>
