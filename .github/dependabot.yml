version: 2
updates:
  - package-ecosystem: pip
    directory: /pipeline
    schedule:
      interval: weekly
    groups:
      pipeline-python:
        patterns: ["*"]
    open-pull-requests-limit: 3

  - package-ecosystem: pip
    directory: /dashboard
    schedule:
      interval: weekly
    groups:
      dashboard-python:
        patterns: ["*"]
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 3

  - package-ecosystem: terraform
    directory: /infra/terraform
    schedule:
      interval: weekly
    groups:
      terraform:
        patterns: ["*"]
    open-pull-requests-limit: 3

  - package-ecosystem: docker
    directory: /pipeline
    schedule:
      interval: weekly
    open-pull-requests-limit: 2

  - package-ecosystem: docker
    directory: /dashboard
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
