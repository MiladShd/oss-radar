name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.5.7"
          terraform_wrapper: false
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -r pipeline/requirements.txt -r requirements-dev.txt
          pip install --no-deps -e pipeline
          pip install -r dashboard/requirements.txt
      - name: Lint
        run: |
          actionlint
          shellcheck scripts/*.sh
          ruff check pipeline/oss_radar pipeline/tests dashboard scripts
      - name: Verify built wheel contents and entry points
        run: |
          wheel_dir="$RUNNER_TEMP/oss-radar-wheel"
          install_dir="$RUNNER_TEMP/oss-radar-wheel-install"
          python -m pip wheel --no-deps ./pipeline -w "$wheel_dir"
          python -m pip install --no-deps --target "$install_dir" "$wheel_dir"/oss_radar-*.whl
          PYTHONPATH="$install_dir" python - <<'PY'
          import json
          from importlib import resources
          from pathlib import Path

          import oss_radar
          from oss_radar import cli, validate_growth

          install_dir = Path(__import__("os").environ["PYTHONPATH"]).resolve()
          assert install_dir in Path(oss_radar.__file__).resolve().parents
          expected = {
              "config/active_features.json",
              "ingest/fixtures/smoke.json",
              "validate_growth.py",
          }
          root = resources.files("oss_radar")
          missing = sorted(path for path in expected if not root.joinpath(path).is_file())
          assert not missing, f"wheel is missing runtime files: {missing}"
          assert json.loads(root.joinpath("config/active_features.json").read_text())["download"]
          assert callable(validate_growth.main)
          try:
              cli.main(["--help"])
          except SystemExit as exc:
              assert exc.code == 0
          else:
              raise AssertionError("CLI help did not exit normally")
          PY
          smoke_json="$RUNNER_TEMP/oss-radar-wheel-smoke.json"
          PYTHONPATH="$install_dir" python -m oss_radar.cli smoke \
            --out "$RUNNER_TEMP/oss-radar-wheel-smoke" > "$smoke_json"
          python -c 'import json,sys; data=json.load(open(sys.argv[1])); assert data["mode"] == "fixture-offline"' "$smoke_json"
      - name: Validate Terraform
        run: |
          terraform -chdir=infra/terraform fmt -check -diff
          terraform -chdir=infra/terraform init -backend=false -input=false
          terraform -chdir=infra/terraform validate
      - name: Audit runtime dependency graphs
        run: |
          pip-audit -r pipeline/requirements.txt
          pip-audit -r dashboard/requirements.txt
      - name: Validation gate (leak guard — blocks merge if the gate regresses)
        run: pytest pipeline/tests/test_validation_gate.py -q
      - name: Deterministic source-tree end-to-end smoke
        run: python -m oss_radar.cli smoke --out "$RUNNER_TEMP/oss-radar-smoke"
      - name: Test pipeline
        run: pytest pipeline/tests -q
      - name: Test dashboard
        run: pytest dashboard/tests -q
