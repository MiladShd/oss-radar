name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.5.7"
          terraform_wrapper: false
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -r pipeline/requirements.txt -r requirements-dev.txt
          pip install --no-deps -e pipeline
          pip install -r dashboard/requirements.txt
      - name: Lint
        run: |
          actionlint
          shellcheck scripts/*.sh
          ruff check pipeline/oss_radar pipeline/tests dashboard scripts
      - name: Validate Terraform
        run: |
          terraform -chdir=infra/terraform fmt -check -diff
          terraform -chdir=infra/terraform init -backend=false -input=false
          terraform -chdir=infra/terraform validate
      - name: Audit runtime dependency graphs
        run: |
          pip-audit -r pipeline/requirements.txt
          pip-audit -r dashboard/requirements.txt
      - name: Validation gate (leak guard — blocks merge if the gate regresses)
        run: pytest pipeline/tests/test_validation_gate.py -q
      - name: Test pipeline
        run: pytest pipeline/tests -q
      - name: Test dashboard
        run: pytest dashboard/tests -q
