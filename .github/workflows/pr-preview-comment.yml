name: PR Preview Comment

# A pull_request token is read-only for public forks. Relay only the text artifact from the
# completed unprivileged preview through this trusted default-branch workflow; never check out
# or execute contributor code here.
on:
  workflow_run:
    workflows: ["PR Preview"]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  comment:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0].number != null
    runs-on: ubuntu-latest
    steps:
      - name: Download preview result from the triggering run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pr-preview-${{ github.event.workflow_run.pull_requests[0].number }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Post sanitized preview comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        with:
          script: |
            const fs = require('fs');
            const raw = fs.readFileSync('preview_comment.md', 'utf8');
            const preview = raw.slice(0, 59000).replaceAll('@', '@\u200b');
            const body = `<!-- oss-radar-preview -->\n## OSS Radar PR preview\n\n${preview}`;
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: Number(process.env.PR_NUMBER),
              body,
            });
