name: OSS Radar Auto Triage

on:
  workflow_run:
    workflows: ["CI", "PR Preview", "CodeQL"]
    types: [completed]
  schedule:
    - cron: "10 10 * * *"  # catch any daily report PR after the 09:30 UTC pipeline
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write
  issues: write
  checks: read

concurrency:
  group: oss-radar-auto-triage
  cancel-in-progress: false

jobs:
  merge-allowlisted-bot-prs:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Drain eligible bot PRs and consolidate duplicate drift issues
        run: python scripts/auto_triage.py
