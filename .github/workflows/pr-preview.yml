name: PR Preview

# Lets contributors "run a PR": the pipeline executes on the branch against free public
# data sources and a local DuckDB warehouse, then posts the resulting momentum/risk movers
# back as a PR comment. No cloud credentials required.

on:
  pull_request:

jobs:
  preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -r pipeline/requirements.txt
          pip install --no-deps -e pipeline
      - name: Run pipeline (dry-run · 30 packages · DuckDB)
        env:
          OSS_RADAR_BACKEND: duckdb
          OSS_RADAR_DUCKDB_PATH: preview.duckdb
          OSS_RADAR_ANTHROPIC_API_KEY: DISABLED
        run: python -m oss_radar.cli run --dry-run --limit 30
      - name: Independently reproduce any feature lift
        env:
          OSS_RADAR_BACKEND: duckdb
          OSS_RADAR_DUCKDB_PATH: preview.duckdb
        run: |
          git show "origin/${GITHUB_BASE_REF}:pipeline/oss_radar/config/active_features.json" \
            > /tmp/oss-radar-base-features.json
          python scripts/feature_pr_check.py \
            --base /tmp/oss-radar-base-features.json \
            --head pipeline/oss_radar/config/active_features.json
      - name: Exercise validation gate (candidate holds are expected)
        env:
          OSS_RADAR_BACKEND: duckdb
          OSS_RADAR_DUCKDB_PATH: preview.duckdb
        # This reduced cohort is live public data, not a captured base/head benchmark. A failed
        # candidate is therefore an expected safe outcome: the pipeline keeps the prior champion.
        # Deterministic gate tests and the base/head feature check remain merge-blocking.
        run: python -m oss_radar.cli gate
      - name: Build comment
        env:
          OSS_RADAR_BACKEND: duckdb
          OSS_RADAR_DUCKDB_PATH: preview.duckdb
        run: python scripts/pr_comment.py
      - name: Upload preview result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-preview-${{ github.event.pull_request.number }}
          path: preview_comment.md
          if-no-files-found: error
          retention-days: 1
