name: Feature request
description: Propose a scoped product, data, model, or operational improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What decision or workflow is hard today?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the observable result, not only an implementation.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Validation approach
      description: How should the change be tested or measured? For model work, name the cohort and metric.
    validations:
      required: true
  - type: textarea
    id: tradeoffs
    attributes:
      label: Risks and trade-offs
      description: Consider upstream rate limits, cost, privacy, model leakage, and maintenance burden.
