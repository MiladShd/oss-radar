name: Bug report
description: Report a reproducible problem in the pipeline, dashboard, models, or deployment.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials or private vulnerability details. Use the Security tab for those.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Data ingestion
        - Feature engineering or model evaluation
        - Dashboard or API
        - GitHub automation
        - GCP or Terraform
        - Documentation
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: What happened, including the run ID or commit SHA when available?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Minimal commands, inputs, and environment details.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Sanitized logs, screenshots, or API responses.
